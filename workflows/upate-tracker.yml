name: Update NVT Role Tracker

on:
  # Run automatically on 1st and 3rd Wednesday nights (after 8:45 PM ET meetings end)
  schedule:
    - cron: '0 2 * * 4'  # 2 AM UTC Thursday = 10 PM ET Wednesday (after meeting ends)
  
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Needed to commit data.json back to repo
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Run agenda processor
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/process_agendas.py

      - name: Commit updated data.json
        run: |
          git config user.name "NVT Tracker Bot"
          git config user.email "action@github.com"
          git add data/data.json
          git diff --staged --quiet || git commit -m "Auto-update: process new meeting agendas [skip ci]"
          git push
